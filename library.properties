name=EspBle
version=1.2.0
author=TANAKA Masayuki
maintainer=TANAKA Masayuki
sentence=General-purpose Bluetooth Low Energy library for ESP32 Arduino.
paragraph=EspBle talks to the NimBLE host bundled with Arduino-ESP32 directly, without the bundled BLE wrapper classes. It provides central and peripheral roles with multiple simultaneous connections, generic GATT client and server operations addressable by UUID or attribute handle, pairing and bonding, standard GATT services, and composable profiles: HID device and host (keyboard, mouse, consumer and system control, gamepad, vendor and fully custom reports) plus BLE MIDI device and host. On the original ESP32, whose prebuilt libraries are built with Bluedroid, EspBle bundles its own NimBLE host; that chip has a BLE 4.2 controller, so some features are unavailable and behaviour may differ slightly. Experimental Bluetooth Classic support uses a separately built, namespaced Bluedroid host.
category=Communication
