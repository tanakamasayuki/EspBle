name: Compile Examples

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "examples/**"
      - "library.properties"
      - "tools/build_classic_bluedroid_host.sh"
      - "tools/classic_bluedroid_host/**"
      - "tools/verify_classic_archive.py"
      - "tools/release_hooks/pre_bump.py"
      - "tests/unit/hci_router/test_classic_namespaced_calls.py"
      - ".github/workflows/compile-examples.yml"
  pull_request:
    paths:
      - "src/**"
      - "examples/**"
      - "library.properties"
      - "tools/build_classic_bluedroid_host.sh"
      - "tools/classic_bluedroid_host/**"
      - "tools/verify_classic_archive.py"
      - "tools/release_hooks/pre_bump.py"
      - "tests/unit/hci_router/test_classic_namespaced_calls.py"
      - ".github/workflows/compile-examples.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino platform
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-esp32-${{ hashFiles('examples/CompileSmoke/sketch.yaml') }}

      - name: Verify Classic archive and link isolation
        run: python3 tools/release_hooks/pre_bump.py

      - name: Compile all examples
        run: |
          set -euo pipefail
          status=0
          for sketch in $(find examples -name sketch.yaml -printf '%h\n' | sort); do
            # Most examples build for esp32s3. Classic examples only run on the
            # original ESP32, so they ship an esp32 profile instead; fall back to
            # each sketch's default profile rather than failing on a missing one.
            if grep -qE '^[[:space:]]+esp32s3:' "${sketch}/sketch.yaml"; then
              profile=esp32s3
            else
              profile=$(grep -oP '^default_profile:\s*\K\S+' "${sketch}/sketch.yaml" || true)
            fi
            if [ -z "${profile}" ]; then
              echo "::error::no usable profile: ${sketch}"
              status=1
              continue
            fi
            echo "::group::${sketch} (${profile})"
            if ! arduino-cli compile --profile "${profile}" "${sketch}"; then
              echo "::error::compile failed: ${sketch} (${profile})"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "${status}"
