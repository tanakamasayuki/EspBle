name: Compile Examples

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "examples/**"
      - "library.properties"
      - "tools/build_classic_bluedroid_host.sh"
      - "tools/classic_bluedroid_host/**"
      - "tools/verify_classic_archive.py"
      - "tools/release_hooks/pre_bump.py"
      - "tests/unit/hci_router/test_classic_namespaced_calls.py"
      - ".github/workflows/compile-examples.yml"
  pull_request:
    paths:
      - "src/**"
      - "examples/**"
      - "library.properties"
      - "tools/build_classic_bluedroid_host.sh"
      - "tools/classic_bluedroid_host/**"
      - "tools/verify_classic_archive.py"
      - "tools/release_hooks/pre_bump.py"
      - "tests/unit/hci_router/test_classic_namespaced_calls.py"
      - ".github/workflows/compile-examples.yml"
  workflow_dispatch:
    inputs:
      core_version:
        description: "arduino-esp32 version to build with instead of the one each sketch.yaml pins (e.g. 3.3.13). Empty keeps the pinned versions. Only this run's checkout is rewritten."
        required: false
        default: ""

concurrency:
  group: compile-examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per target so the targets build in parallel and a failure names
        # its target. These are the targets the examples declare (see
        # docs/BOARDS.*.md); m5stack_tab5 is a board variant of esp32p4 used by two
        # examples and is left to the manual board matrix. Examples without the
        # job's profile (the Classic ones outside esp32) are skipped.
        profile: [esp32s3, esp32, esp32c3, esp32c6, esp32h2, esp32p4]
        # Each target is split into shards over the sorted example list to cut
        # wall time (~20 s per example). 6 targets x 3 shards = 18 jobs stays
        # under the 20 concurrent jobs a free account runs at once.
        shard: [1, 2, 3]
    env:
      SHARDS: 3

    name: compile (${{ matrix.profile }} ${{ matrix.shard }}/3)

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Override the core version
        if: ${{ inputs.core_version != '' }}
        env:
          CORE_VERSION: ${{ inputs.core_version }}
        run: |
          set -euo pipefail
          if [[ ! "$CORE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::core_version must look like 3.3.13 or 3.3.13-rc1: $CORE_VERSION"
            exit 1
          fi
          find examples -name sketch.yaml -print0 \
            | xargs -0 sed -i -E "s/esp32:esp32 \([^)]*\)/esp32:esp32 ($CORE_VERSION)/"
          grep -rhoE "esp32:esp32 \([^)]*\)" --include=sketch.yaml examples | sort | uniq -c
          echo "Built with Arduino-ESP32 $CORE_VERSION (sketch.yaml rewritten in this run only)" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Arduino platform
        uses: actions/cache@v4
        with:
          # The esp32 platform install (several GB, every target's libs) is the
          # same for all jobs, so they share one key instead of one per target.
          path: ~/.arduino15
          # Keyed on the pinned platform lines, so a core bump busts it; the
          # override step runs first, so a requested core is already in the hash.
          key: arduino-esp32-${{ inputs.core_version }}-${{ hashFiles('examples/**/sketch.yaml') }}

      - name: Verify Classic archive and link isolation
        # Checks the library itself, not a target build; once is enough.
        if: ${{ matrix.profile == 'esp32' && matrix.shard == 1 }}
        run: python3 tools/release_hooks/pre_bump.py

      - name: Compile examples (${{ matrix.profile }})
        env:
          PROFILE: ${{ matrix.profile }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          status=0
          built=0
          skipped=0
          index=0
          for sketch in $(find examples -name sketch.yaml -printf '%h\n' | LC_ALL=C sort); do
            if ! grep -qE "^[[:space:]]+${PROFILE}:" "${sketch}/sketch.yaml"; then
              skipped=$((skipped + 1))
              continue
            fi
            # Deal the examples that have this profile round-robin, so every
            # shard gets a similar share of each example group.
            mine=$((index % SHARDS == SHARD - 1))
            index=$((index + 1))
            [ "${mine}" -eq 1 ] || continue
            echo "::group::${sketch} (${PROFILE})"
            if arduino-cli compile --profile "${PROFILE}" "${sketch}"; then
              built=$((built + 1))
            else
              echo "::error::compile failed: ${sketch} (${PROFILE})"
              status=1
            fi
            echo "::endgroup::"
          done
          echo "${PROFILE} shard ${SHARD}/${SHARDS}: ${built} built of ${index} with this profile, ${skipped} without it" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${built}" -eq 0 ]; then
            echo "::error::shard ${SHARD} of ${PROFILE} built nothing"
            status=1
          fi
          exit "${status}"
