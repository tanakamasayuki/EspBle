profiles:
  p4_peer_device:
    fqbn: esp32:esp32:esp32p4:ChipVariant=prev3,CDCOnBoot=default
    platforms:
      - platform: esp32:esp32 (4.0.0)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../../

  s3_peer_device:
    fqbn: esp32:esp32:esp32s3:EraseFlash=all
    platforms:
      - platform: esp32:esp32 (4.0.0)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json

  s31_peer_device:
    fqbn: esp32:esp32:esp32s31:EraseFlash=all
    platforms:
      - platform: esp32:esp32 (4.0.0)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json

default_profile: s3_peer_device
