[project]
name = "espble-tests"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8",
    "pytest-embedded>=2.0",
    "pytest-embedded-serial>=2.0",
    "pytest-embedded-arduino-cli>=1.6.0",
    "pytest-html>=4.1.1",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:record_xml_attribute is an experimental feature:pytest.PytestExperimentalApiWarning",
]
addopts = "--save-state"
# Nothing here lists or excludes directories. `pytest` with no arguments means
# everything that looks like a test, and what is kept out of it is kept out by
# its file name: the manual suites are not named `test_*.py`, so collection
# never picks them up however the run is started. A list of what is in would go
# stale silently when a directory is added, and a list of what is out has to
# restate pytest's own defaults or collection walks .venv.
